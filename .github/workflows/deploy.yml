name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Verify Pages files
        run: |
          echo "===== dist ====="
          ls -R dist

          echo "===== Assets ====="
          ls -l dist/assets

          echo "===== Artifacts ====="
          ls -R dist/artifacts

          echo "===== Checking required files ====="
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f vite.config.ts

          echo "===== Checking for old paths ====="
          if grep -R "/ahamlang.tech/artifacts" dist; then
            echo "❌ Old paths found!"
            exit 1
          else
            echo "✅ Paths are correct"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
